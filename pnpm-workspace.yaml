packages:
  - apps/*
  - packages/*

# Fail if your Node version does not match "engines" in the root package.json.
engineStrict: true

# pnpm only runs dependency install scripts you explicitly allow, so a
# compromised library can't run code on your machine when it's installed.
allowBuilds:
  # Download the Prisma engine that runs migrations.
  '@prisma/engines': true
  prisma: true
  # Telemetry bundled with swagger-ui-dist: not needed.
  '@scarf/scarf': false
