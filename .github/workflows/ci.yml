name: CI

# Se ejecuta en cada pull request y en cada push a main.
on:
  pull_request:
  push:
    branches: [main]

# Si subes otro commit a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mínimos permisos: el CI solo necesita leer el código.
permissions:
  contents: read

jobs:
  check:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Las actions se fijan por SHA de commit (no por etiqueta) para que nadie
      # pueda cambiar el código que ejecutas moviendo una etiqueta.
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar pnpm (versión de packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar Node (versión de .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Compilar
        run: pnpm build

      - name: Tests unitarios
        run: pnpm test

      - name: Tests e2e de la API
        run: pnpm --filter @psq/api test:e2e
